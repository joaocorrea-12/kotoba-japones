<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="icon" type="image/svg+xml" href="mark.svg"><link rel="stylesheet" href="style.css">

  <aside class="sidebar">

    <nav aria-label="Navegação principal">
      <a href="#today" data-route="today"><span aria-hidden="true">◉</span> Hoje <span class="nav-jp" lang="ja">今日</span></a>
      <a href="#words" data-route="words"><span aria-hidden="true">▤</span> Suas palavras <span class="nav-jp" lang="ja">言葉</span></a>
