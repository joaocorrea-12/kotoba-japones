name: Kotoba
options:
  bundleIdPrefix: org.kotoba
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR
  knownRegions: [pt-BR, Base]
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    KOTOBA_APP_GROUP: group.org.kotoba.app
packages:
  KotobaCore:
    path: Packages/KotobaCore
targets:
  Kotoba:
    type: application
    platform: iOS
    sources: [iOS/App, iOS/Shared]
    dependencies:
      - package: KotobaCore
      - target: KotobaWidgets
        embed: true
    info:
      path: iOS/Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleDevelopmentRegion: pt_BR
        CFBundleURLTypes:
          - CFBundleURLName: org.kotoba.word
            CFBundleURLSchemes: [kotoba]
        KotobaAppGroup: $(KOTOBA_APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/Configuration/Kotoba.entitlements
      properties:
        com.apple.security.application-groups: [$(KOTOBA_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kotoba.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KotobaWidgets:
    type: app-extension
    platform: iOS
    sources: [iOS/Widgets, iOS/Shared]
    dependencies:
      - package: KotobaCore
    info:
      path: iOS/Configuration/Widget-Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleDevelopmentRegion: pt_BR
        KotobaAppGroup: $(KOTOBA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Configuration/KotobaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(KOTOBA_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kotoba.app.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  KotobaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOS/Tests]
    dependencies:
      - target: Kotoba
      - package: KotobaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.kotoba.app.tests
schemes:
  Kotoba:
    build:
      targets:
        Kotoba: all
        KotobaWidgets: all
        KotobaTests: [test]
    test:
      targets: [KotobaTests]
      gatherCoverageData: true
