name: Android — APK e testes
on:
  push:
    paths:
      - 'android/**'
      - 'Packages/KotobaCore/Sources/KotobaCore/Resources/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'Packages/KotobaCore/Sources/KotobaCore/Resources/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Testar, verificar e gerar APK e App Bundle
        run: bash android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-android-aab-nao-assinado
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-android
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/
          if-no-files-found: ignore
  abertura-no-emulador:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kotoba-android-apk
          path: work/apk
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r work/apk/app-debug.apk
            python3 android/scripts/smoke-emulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-emulador-android
          path: work/android-smoke/
          if-no-files-found: ignore
